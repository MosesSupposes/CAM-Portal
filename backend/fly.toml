app = "cam-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "prod"
  PORT = "8080"
  DB_CONNECTION = "mysql"
  DB_HOST = "cam-mysql.internal"
  DB_PORT = "3306"
  DB_DATABASE = "cam_astrology_db"
  DB_USERNAME = "cam_user"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
