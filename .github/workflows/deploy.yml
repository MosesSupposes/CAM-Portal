name: CAM Cosmic Platform CI/CD

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Test
        run: |
          cd frontend
          npm ci || npm install
          npm run test --if-present

  validate-backend:
    name: Laravel Backend Lint & Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cam_test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, bcmath
      - name: Install Backend Dependencies
        run: |
          cd backend
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Run Backend Tests
        run: |
          cd backend
          php artisan test --if-present

  build-containers:
    name: Docker Multi-Stage Verification
    needs: [validate-frontend, validate-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Compose Stack
        run: |
          docker compose -f docker/docker-compose.yml build
